<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Categories</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-container">

    <!-- Header -->
    <div class="admin-header">

        <div>
            <h1>Manage Categories</h1>
            <p>Add, edit and delete product categories</p>
        </div>

        <a href="/admin" class="back-btn">
            Dashboard
        </a>

    </div>


    <!-- Add / Edit Category -->
    <div class="category-form">

        <h2 th:text="${category.id == null ? 'Add Category' : 'Edit Category'}">
            Add Category
        </h2>

        <form th:action="@{/admin/categories/save}"
              th:object="${category}"
              method="post">

            <input type="hidden"
                   th:field="*{id}">

            <input type="text"
                   th:field="*{name}"
                   placeholder="Enter category name"
                   required>

            <button type="submit"
                    th:text="${category.id == null ? 'Add Category' : 'Update Category'}">
                Add Category
            </button>

        </form>

    </div>


    <!-- Category List -->
    <div class="category-list">

        <h2>All Categories</h2>

        <table border="1">

            <thead>

            <tr>
                <th>ID</th>
                <th>Category Name</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="cat : ${categories}">

                <td th:text="${cat.id}">
                    1
                </td>

                <td th:text="${cat.name}">
                    Electronics
                </td>

                <td>

                    <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}"
                       class="edit-btn">
                        Edit
                    </a>

                    <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}"
                       class="delete-btn"
                       onclick="return confirm('Are you sure you want to delete this category?');">
                        Delete
                    </a>

                </td>

            </tr>

            </tbody>

        </table>


        <!-- Empty message -->

        <div th:if="${#lists.isEmpty(categories)}"
             class="empty-message">

            <p>No categories found.</p>

        </div>

    </div>

</div>

</body>
</html>
