<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-container">

    <!-- Header -->
    <div class="admin-header">

        <div>
            <h1>Manage Products</h1>
            <p>Add, edit and delete products</p>
        </div>

        <a href="/admin" class="back-btn">
            Dashboard
        </a>

    </div>


    <!-- Add / Edit Product -->

    <div class="category-form">

        <h2 th:text="${product.id == null ? 'Add Product' : 'Edit Product'}">
            Add Product
        </h2>


        <form th:action="@{/admin/products/save}"
              th:object="${product}"
              method="post"
              enctype="multipart/form-data">

            <!-- ID -->

            <input type="hidden"
                   th:field="*{id}">


            <!-- Product Name -->

            <input type="text"
                   th:field="*{name}"
                   placeholder="Product Name"
                   required>


            <!-- Price -->

            <input type="number"
                   th:field="*{price}"
                   placeholder="Price"
                   step="0.01"
                   required>


            <!-- Stock -->

            <input type="number"
                   th:field="*{stock}"
                   placeholder="Stock"
                   required>


            <!-- IMAGE -->

            <div class="image-upload-box">

                <h3>Product Image</h3>

                <!-- File Upload -->

                <label for="imageFile">
                    Upload Image From Computer
                </label>

                <input type="file"
                       name="imageFile"
                       id="imageFile"
                       accept="image/*">


                <div class="or-text">
                    OR
                </div>


                <!-- Image URL -->

                <label for="imageUrl">
                    Image URL
                </label>

                <input type="url"
                       name="imageUrl"
                       id="imageUrl"
                       placeholder="https://example.com/product.jpg">


                <!-- Preview Button -->

                <button type="button"
                        id="previewImageBtn"
                        class="preview-btn">

                    Preview Image

                </button>


                <!-- Image Preview -->

                <div class="image-preview">

                    <img id="imagePreview"
                         alt="Image Preview"
                         style="display:none;">

                </div>

            </div>


            <!-- Existing Image -->

            <div th:if="${product.image != null and !#strings.isEmpty(product.image)}"
                 class="current-image">

                <p>Current Image:</p>

                <img th:src="${product.image}"
                     alt="Current Product Image">

            </div>


            <!-- Category -->

            <select th:field="*{category}"
                    required>

                <option value="">
                    Select Category
                </option>

                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}">
                </option>

            </select>


            <!-- Submit -->

            <button type="submit"
                    th:text="${product.id == null ? 'Add Product' : 'Update Product'}">

                Add Product

            </button>

        </form>

    </div>


    <!-- Product List -->

    <div class="category-list">

        <h2>All Products</h2>


        <table border="1">

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Price</th>

                <th>Stock</th>

                <th>Category</th>

                <th>Image</th>

                <th>Actions</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="prod : ${products}">

                <td th:text="${prod.id}">
                    1
                </td>


                <td th:text="${prod.name}">
                    Product
                </td>


                <td th:text="${prod.price}">
                    100
                </td>


                <td th:text="${prod.stock}">
                    10
                </td>


                <td th:text="${prod.category.name}">
                    Electronics
                </td>


                <!-- Product Image -->

                <td>

                    <img th:if="${prod.image != null and !#strings.isEmpty(prod.image)}"
                         th:src="${prod.image}"
                         alt="Product Image"
                         class="product-table-image">

                    <span th:if="${prod.image == null or #strings.isEmpty(prod.image)}">
                        No Image
                    </span>

                </td>


                <!-- Actions -->

                <td>

                    <a th:href="@{/admin/products/edit/{id}(id=${prod.id})}"
                       class="edit-btn">

                        Edit

                    </a>


                    <a th:href="@{/admin/products/delete/{id}(id=${prod.id})}"
                       class="delete-btn"
                       onclick="return confirm('Are you sure you want to delete this product?');">

                        Delete

                    </a>

                </td>

            </tr>

            </tbody>

        </table>


        <div th:if="${#lists.isEmpty(products)}"
             class="empty-message">

            <p>No products found.</p>

        </div>

    </div>

</div>


<script>

    const imageFile =
        document.getElementById("imageFile");

    const imageUrl =
        document.getElementById("imageUrl");

    const previewButton =
        document.getElementById("previewImageBtn");

    const imagePreview =
        document.getElementById("imagePreview");


    /*
     * File Preview
     */

    imageFile.addEventListener("change", function () {

        const file = this.files[0];

        if (file) {

            const reader =
                new FileReader();

            reader.onload = function (event) {

                imagePreview.src =
                    event.target.result;

                imagePreview.style.display =
                    "block";
            };

            reader.readAsDataURL(file);
        }
    });


    /*
     * URL Preview
     */

    previewButton.addEventListener("click", function () {

        const url =
            imageUrl.value.trim();

        if (url) {

            imagePreview.src = url;

            imagePreview.style.display =
                "block";

        } else {

            alert("Please upload an image or enter an image URL.");

        }

    });


    /*
     * If URL is entered,
     * clear file selection.
     */

    imageUrl.addEventListener("input", function () {

        if (this.value.trim() !== "") {

            imageFile.value = "";

        }

    });


    /*
     * If file is selected,
     * clear URL.
     */

    imageFile.addEventListener("change", function () {

        if (this.files.length > 0) {

            imageUrl.value = "";

        }

    });

</script>

</body>
</html>
